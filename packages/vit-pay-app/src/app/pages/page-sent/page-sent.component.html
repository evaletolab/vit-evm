<section class="sent-page">
  <header class="topbar">
    <a class="back" [routerLink]="['/']" aria-label="Retour">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1>Recevoir</h1>
  </header>

  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="qr-card" *ngIf="!loading && !error && address">
    <div class="qr-placeholder">
      <canvas #qrCanvas width="220" height="220"></canvas>
    </div>
    <p class="address-label">Adresse Safe</p>
    <code class="address">{{ shortAddr }}</code>
    <button class="cta" (click)="copy()">
      <span class="material-symbols-outlined">{{ copied ? 'check' : 'content_copy' }}</span>
      {{ copied ? 'Copié' : 'Copier' }}
    </button>
  </div>

  <div class="amount-card" *ngIf="!loading && !error && address">
    <label class="amount-input">
      <span class="label-text">Montant demandé (optionnel)</span>
      <div class="input-row">
        <input
          type="text"
          inputmode="decimal"
          placeholder="0.00"
          [(ngModel)]="amount"
          (ngModelChange)="onAmountChange()" />
        <span class="unit">xCHF</span>
      </div>
    </label>
    <span class="vit-chip vit-chip--success">Frais sponsorisés · Sepolia</span>
  </div>

  <button class="contact-cta" type="button"
          *ngIf="!loading && !error && address"
          (click)="openContacts()">
    <span class="material-symbols-outlined">contacts</span>
    Envoyer à un contact
  </button>

  <!-- contact picker bottom sheet -->
  <div class="picker" *ngIf="contactsOpen" (click)="closeContacts()">
    <div class="picker__sheet" (click)="$event.stopPropagation()">
      <div class="picker__handle"></div>
      <h3>Carnet d'adresses</h3>
      <ul class="picker__list" *ngIf="contacts.length; else pickerEmpty">
        <li *ngFor="let c of contacts" class="picker__row" (click)="pickContact(c)">
          <span class="picker__avatar">{{ c.name.charAt(0).toUpperCase() }}</span>
          <div class="picker__info">
            <div class="picker__name">{{ c.name }}</div>
            <div class="picker__addr">{{ c.address.slice(0,6) }}…{{ c.address.slice(-4) }}</div>
          </div>
        </li>
      </ul>
      <ng-template #pickerEmpty>
        <p class="picker__empty">
          Aucun contact.
          <a [routerLink]="['/contacts']">Ouvrir le carnet</a>
        </p>
      </ng-template>
    </div>
  </div>
</section>
