<section class="sent-page">
  <header class="topbar">
    <a class="back" [routerLink]="['/']" aria-label="Retour">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1>Recevoir</h1>
  </header>

  <p *ngIf="error" class="error">{{ error }}</p>

  <!-- Contrepartie (demande ciblée) — masque le QR -->
  <div class="counterpart" *ngIf="counterpart">
    <span class="counterpart__avatar">{{ counterpart.name.charAt(0).toUpperCase() }}</span>
    <div class="counterpart__info">
      <div class="counterpart__name">
        {{ counterpart.name }}
        <span
          class="counterpart__badge"
          [class.counterpart__badge--on]="counterpartWhitelisted"
          [attr.title]="counterpartWhitelisted ? 'Dans ton carnet' : 'Hors carnet'">
          <span class="material-symbols-outlined">{{ counterpartWhitelisted ? 'verified' : 'person' }}</span>
        </span>
      </div>
      <div class="counterpart__meta" *ngIf="counterpartMeta">{{ counterpartMeta }}</div>
      <p class="counterpart__save-err" *ngIf="saveError">{{ saveError }}</p>
    </div>
    <button
      type="button"
      class="counterpart__save"
      (click)="saveCounterpart()"
      [disabled]="counterpartWhitelisted"
      [attr.aria-label]="counterpartWhitelisted ? 'Déjà dans le carnet' : 'Enregistrer dans le carnet'">
      <span class="material-symbols-outlined">{{ counterpartWhitelisted ? 'bookmark_added' : 'bookmark_add' }}</span>
      {{ counterpartWhitelisted ? 'Enregistré' : 'Enregistrer' }}
    </button>
  </div>

  <!-- QR : uniquement sans contrepartie -->
  <div class="qr-card" *ngIf="!loading && !error && address && !counterpart">
    <div class="qr-placeholder">
      <canvas #qrCanvas width="220" height="220"></canvas>
    </div>
    <p class="address-label">Adresse Safe</p>
    <code class="address">{{ shortAddr }}</code>
  </div>

  <ng-container *ngIf="!loading && !error && address">
    <vit-amount-field
      [label]="counterpart ? 'Montant demandé' : 'Montant demandé (optionnel)'"
      [(ngModel)]="amount"
      (ngModelChange)="onAmountChange()">
    </vit-amount-field>

    <button class="cta" type="button" (click)="copy()">
      <span class="material-symbols-outlined">{{ copied ? 'check' : 'content_copy' }}</span>
      {{ copied ? 'Copié' : 'Copier le lien' }}
    </button>

    <span class="vit-chip vit-chip--success">Frais sponsorisés · Sepolia</span>
  </ng-container>
</section>
